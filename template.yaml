overview: |
  Slim, lightweight manipulators are key to operating safely around people. Placing motors near the base and sending torque to distal joints through remote transmissions (e.g., wires or Bowden cables) lowers arm inertia and size, but existing designs either add mass (pulleys for redirection) or lose efficiency to friction. Flexible-shaft transmission avoids both issues, yet slack that appears when joints bend causes helical buckling and growing angular transmission error. We propose SHAFT, a Slack-compensating, Helical-buckling-Attenuating Flexible-shaft Transmission that removes this slack with a tensioner located at the proximal side, so the moving mass of the arm does not increase. On a transmission path with four 90-degree bends, SHAFT achieved roughly 30% higher efficiency and roughly 65% lower angular transmission error than a flexible shaft without a tensioner. We also built a 6-DoF arm with a 1-DoF gripper, composed of a rotary module that houses the motors and tensioner and an arm module weighing 280 g. This remote actuation approach offers a lightweight, efficient path toward deploying safe robots in human environments.

